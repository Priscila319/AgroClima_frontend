<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="1740" viewBox="0 0 2480 1740">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#167c55"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10z" fill="#bd4949"/></marker>
  <style>
    text { font-family: 'DejaVu Sans', Arial, sans-serif; }
    .title { font-size: 43px; font-weight: 700; fill: #0b3024; letter-spacing: -1px; }
    .subtitle { font-size: 22px; fill: #65766e; }
    .subtitle-small { font-size: 16px; fill: #65766e; }
    .section { font-size: 15px; font-weight: 800; fill: #167c55; letter-spacing: 2px; }
    .kicker { font-size: 13px; font-weight: 800; letter-spacing: 1.4px; }
    .card-title { font-size: 21px; font-weight: 700; fill: #192923; }
    .card-title-small { font-size: 18px; font-weight: 700; fill: #192923; }
    .body { font-size: 16px; fill: #65766e; }
    .small { font-size: 14px; fill: #65766e; }
    .tiny { font-size: 12px; fill: #65766e; }
    .flow-label { font-size: 15px; font-weight: 700; fill: #167c55; }
    .warning-title { font-size: 20px; font-weight: 800; fill: #bd4949; }
    .warning-text { font-size: 15px; fill: #192923; }
    .foot { font-size: 14px; fill: #65766e; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#f5f8f6"/>
<rect x="36" y="35" width="2408" height="1670" rx="30" fill="none" stroke="#e0eae4" stroke-width="2"/>
<text x="78" y="105" class="title">Segurança e armazenamento</text>
<text x="80" y="151" class="subtitle">Implementação real: front-end JavaScript, regras no cliente e persistência local — sem backend neste checkout.</text>
<rect x="58" y="188" width="2364" height="990" rx="25" fill="#ffffff" stroke="#cfe1d6" stroke-width="2"/><text x="82" y="230" class="section">FLUXO REAL NO NAVEGADOR</text><text x="82" y="258" class="subtitle-small">Os módulos abaixo existem no repositório e são usados pela aplicação.</text><rect x="75" y="290" width="330" height="240" rx="20" fill="#edf4fb" stroke="#dce7e0" stroke-width="2"/><rect x="75" y="290" width="8" height="240" rx="4" fill="#2879c9"/><text x="100" y="327" class="kicker" fill="#2879c9">01 · ENTRADA</text><text x="100" y="361" class="card-title" fill="#192923">Pessoa e sessão</text><text x="100" y="403" class="body" fill="#65766e">Login demonstrativo</text><text x="100" y="432" class="body" fill="#65766e">auth-view.js</text><text x="100" y="461" class="body" fill="#65766e">E-mail define o papel;</text><text x="100" y="490" class="body" fill="#65766e">senha não é validada no servidor.</text><rect x="425" y="290" width="350" height="240" rx="20" fill="#f1f7f3" stroke="#dce7e0" stroke-width="2"/><rect x="425" y="290" width="8" height="240" rx="4" fill="#167c55"/><text x="450" y="327" class="kicker" fill="#167c55">02 · INTERFACE</text><text x="450" y="361" class="card-title" fill="#192923">Views de administração</text><text x="450" y="403" class="body" fill="#65766e">shell-view.js</text><text x="450" y="432" class="body" fill="#65766e">pages/admin-extra.js</text><text x="450" y="461" class="body" fill="#65766e">Telas separadas: RBAC,</text><text x="450" y="490" class="body" fill="#65766e">Segurança e Logs.</text><rect x="795" y="290" width="385" height="240" rx="20" fill="#f3effa" stroke="#dce7e0" stroke-width="2"/><rect x="795" y="290" width="8" height="240" rx="4" fill="#7654b5"/><text x="820" y="327" class="kicker" fill="#7654b5">03 · EVENTOS</text><text x="820" y="361" class="card-title" fill="#192923">Eventos da interface</text><text x="820" y="403" class="body" fill="#65766e">events/index.js</text><text x="820" y="432" class="body" fill="#65766e">data-action / data-form</text><text x="820" y="461" class="body" fill="#65766e">Delegação de cliques e formulários;</text><text x="820" y="490" class="body" fill="#65766e">não é controller HTTP.</text><rect x="1198" y="290" width="470" height="240" rx="20" fill="#fff7e6" stroke="#dce7e0" stroke-width="2"/><rect x="1198" y="290" width="8" height="240" rx="4" fill="#bd7d13"/><text x="1223" y="327" class="kicker" fill="#bd7d13">04 · MÓDULOS</text><text x="1223" y="361" class="card-title" fill="#192923">Regras locais</text><text x="1223" y="403" class="body" fill="#65766e">modules/auth.js → resolveRole()</text><text x="1223" y="432" class="body" fill="#65766e">Authentication → Authorization →</text><text x="1223" y="461" class="body" fill="#65766e">RBAC → Permission → menu/rota</text><text x="1223" y="490" class="body" fill="#65766e">settings.js / audit.js → dados locais</text><rect x="1686" y="290" width="320" height="240" rx="20" fill="#edf4fb" stroke="#dce7e0" stroke-width="2"/><rect x="1686" y="290" width="8" height="240" rx="4" fill="#2879c9"/><text x="1711" y="327" class="kicker" fill="#2879c9">05 · PERSISTÊNCIA</text><text x="1711" y="361" class="card-title" fill="#192923">Repositório local</text><text x="1711" y="403" class="body" fill="#65766e">data/local-repository.js</text><text x="1711" y="432" class="body" fill="#65766e">Lê e grava objetos JSON</text><text x="1711" y="461" class="body" fill="#65766e">com prefixo agroclima:.</text><rect x="2024" y="290" width="370" height="240" rx="20" fill="#f1f7f3" stroke="#dce7e0" stroke-width="2"/><rect x="2024" y="290" width="8" height="240" rx="4" fill="#167c55"/><text x="2049" y="327" class="kicker" fill="#167c55">06 · BROWSER</text><text x="2049" y="361" class="card-title" fill="#192923">Armazenamento</text><text x="2049" y="403" class="body" fill="#65766e">localStorage do navegador</text><text x="2049" y="432" class="body" fill="#65766e">por origem e dispositivo;</text><text x="2049" y="461" class="body" fill="#65766e">sem banco remoto ou sincronização.</text><path d="M405,410 L425,410" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><path d="M775,410 L795,410" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><path d="M1180,410 L1198,410" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><path d="M1668,410 L1686,410" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><path d="M2006,410 L2024,410" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><rect x="445" y="590" width="510" height="155" rx="20" fill="#f1f7f3" stroke="#dce7e0" stroke-width="2"/><rect x="445" y="590" width="8" height="155" rx="4" fill="#167c55"/><text x="470" y="627" class="kicker" fill="#167c55">ESTADO DA INTERFACE</text><text x="470" y="661" class="card-title" fill="#192923">state/store.js</text><text x="470" y="703" class="body" fill="#65766e">Estado em memória: página, tema,</text><text x="470" y="732" class="body" fill="#65766e">formulários e dados já carregados.</text><rect x="1010" y="590" width="510" height="155" rx="20" fill="#edf4fb" stroke="#dce7e0" stroke-width="2"/><rect x="1010" y="590" width="8" height="155" rx="4" fill="#2879c9"/><text x="1035" y="627" class="kicker" fill="#2879c9">RENDERIZAÇÃO</text><text x="1035" y="661" class="card-title" fill="#192923">main.js</text><text x="1035" y="703" class="body" fill="#65766e">Assina mudanças no estado,</text><text x="1035" y="732" class="body" fill="#65766e">atualiza o tema e renderiza views.</text><rect x="1575" y="590" width="500" height="155" rx="20" fill="#f3effa" stroke="#dce7e0" stroke-width="2"/><rect x="1575" y="590" width="8" height="155" rx="4" fill="#7654b5"/><text x="1600" y="627" class="kicker" fill="#7654b5">INTERFACE ATUALIZADA</text><text x="1600" y="661" class="card-title" fill="#192923">Retorno para as páginas</text><text x="1600" y="703" class="body" fill="#65766e">A view atual mostra os dados</text><text x="1600" y="732" class="body" fill="#65766e">e as permissões do papel.</text><path d="M990,530 L700,590" fill="none" stroke="#7654b5" stroke-width="4" marker-end="url(#arrow)"/><path d="M955,657 L1010,657" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><path d="M1520,657 L1575,657" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><rect x="76" y="770" width="2328" height="360" rx="18" fill="#f8fbf9" stroke="#e2ebe5" stroke-width="2"/><text x="102" y="810" class="section">ESTRUTURAS JSON PERSISTIDAS (NÃO SÃO ENTIDADES ORM)</text><rect x="96" y="838" width="700" height="250" rx="20" fill="#ffffff" stroke="#dce7e0" stroke-width="2"/><rect x="96" y="838" width="8" height="250" rx="4" fill="#167c55"/><text x="121" y="875" class="kicker" fill="#167c55">RBAC</text><text x="121" y="909" class="card-title" fill="#192923">Usuários, papéis e permissões</text><text x="121" y="951" class="body" fill="#65766e">agroclima:rbac</text><text x="121" y="980" class="body" fill="#65766e">users[{id, name, email, role, status}]</text><text x="121" y="1009" class="body" fill="#65766e">rolePermissions[role] → permission[]</text><text x="121" y="1038" class="body" fill="#65766e">Roles existentes: Produtor, Analista, Admin.</text><rect x="835" y="838" width="700" height="250" rx="20" fill="#ffffff" stroke="#dce7e0" stroke-width="2"/><rect x="835" y="838" width="8" height="250" rx="4" fill="#2879c9"/><text x="860" y="875" class="kicker" fill="#2879c9">CONFIGURAÇÕES</text><text x="860" y="909" class="card-title" fill="#192923">Preferências da aplicação</text><text x="860" y="951" class="body" fill="#65766e">agroclima:settings</text><text x="860" y="980" class="body" fill="#65766e">general · notifications · appearance</text><text x="860" y="1009" class="body" fill="#65766e">security · tema · região · nome do sistema</text><text x="860" y="1038" class="body" fill="#65766e">Políticas de segurança não são aplicadas</text><text x="860" y="1067" class="body" fill="#65766e">por um provedor externo.</text><rect x="1574" y="838" width="800" height="250" rx="20" fill="#ffffff" stroke="#dce7e0" stroke-width="2"/><rect x="1574" y="838" width="8" height="250" rx="4" fill="#7654b5"/><text x="1599" y="875" class="kicker" fill="#7654b5">LOGS</text><text x="1599" y="909" class="card-title" fill="#192923">Evento de auditoria</text><text x="1599" y="951" class="body" fill="#65766e">agroclima:audit-events · máximo 500</text><text x="1599" y="980" class="body" fill="#65766e">{ user, action, resource, occurredAt,</text><text x="1599" y="1009" class="body" fill="#65766e">  source, status, details }</text><text x="1599" y="1038" class="body" fill="#65766e">Registro local de quem fez o quê, quando</text><text x="1599" y="1067" class="body" fill="#65766e">e em qual recurso.</text><text x="88" y="1155" class="foot">Persistência apenas neste navegador: limpar os dados do site remove esses registros; nenhum usuário/servidor remoto os compartilha.</text><rect x="58" y="1205" width="2364" height="455" rx="25" fill="#fff9f8" stroke="#e4b7b3" stroke-width="2"/><text x="82" y="1250" class="warning-title">CAMADAS DE BACKEND SOLICITADAS, MAS NÃO ENCONTRADAS NO REPOSITÓRIO</text><text x="82" y="1283" class="warning-text">As caixas tracejadas abaixo são uma lista de ausências — não fazem parte do fluxo implementado e não têm conexão com localStorage.</text><rect x="80" y="1330" width="305" height="230" rx="20" fill="#fff4f3" stroke="#bd4949" stroke-width="2" stroke-dasharray="11 9"/><text x="105" y="1367" class="kicker" fill="#bd4949">NÃO IMPLEMENTADO</text><text x="105" y="1401" class="card-title-small" fill="#192923">Autenticação server-side</text><text x="105" y="1436" class="body" fill="#65766e">Não existe provedor</text><text x="105" y="1465" class="body" fill="#65766e">ou validação de senha.</text><rect x="400" y="1330" width="305" height="230" rx="20" fill="#fff4f3" stroke="#bd4949" stroke-width="2" stroke-dasharray="11 9"/><text x="425" y="1367" class="kicker" fill="#bd4949">NÃO IMPLEMENTADO</text><text x="425" y="1401" class="card-title-small" fill="#192923">Controller / API</text><text x="425" y="1436" class="body" fill="#65766e">Nenhum endpoint HTTP</text><text x="425" y="1465" class="body" fill="#65766e">ou controller no projeto.</text><rect x="720" y="1330" width="305" height="230" rx="20" fill="#fff4f3" stroke="#bd4949" stroke-width="2" stroke-dasharray="11 9"/><text x="745" y="1367" class="kicker" fill="#bd4949">NÃO IMPLEMENTADO</text><text x="745" y="1401" class="card-title-small" fill="#192923">DTOs</text><text x="745" y="1436" class="body" fill="#65766e">Sem contratos de</text><text x="745" y="1465" class="body" fill="#65766e">request/response.</text><rect x="1040" y="1330" width="305" height="230" rx="20" fill="#fff4f3" stroke="#bd4949" stroke-width="2" stroke-dasharray="11 9"/><text x="1065" y="1367" class="kicker" fill="#bd4949">NÃO IMPLEMENTADO</text><text x="1065" y="1401" class="card-title-small" fill="#192923">Service backend</text><text x="1065" y="1436" class="body" fill="#65766e">As regras atuais rodam</text><text x="1065" y="1465" class="body" fill="#65766e">no navegador.</text><rect x="1360" y="1330" width="305" height="230" rx="20" fill="#fff4f3" stroke="#bd4949" stroke-width="2" stroke-dasharray="11 9"/><text x="1385" y="1367" class="kicker" fill="#bd4949">NÃO IMPLEMENTADO</text><text x="1385" y="1401" class="card-title-small" fill="#192923">Repository</text><text x="1385" y="1436" class="body" fill="#65766e">Não há camada de</text><text x="1385" y="1465" class="body" fill="#65766e">persistência server-side.</text><rect x="1680" y="1330" width="305" height="230" rx="20" fill="#fff4f3" stroke="#bd4949" stroke-width="2" stroke-dasharray="11 9"/><text x="1705" y="1367" class="kicker" fill="#bd4949">NÃO IMPLEMENTADO</text><text x="1705" y="1401" class="card-title-small" fill="#192923">ORM</text><text x="1705" y="1436" class="body" fill="#65766e">Não há mapeamento</text><text x="1705" y="1465" class="body" fill="#65766e">de entidades.</text><rect x="2000" y="1330" width="305" height="230" rx="20" fill="#fff4f3" stroke="#bd4949" stroke-width="2" stroke-dasharray="11 9"/><text x="2025" y="1367" class="kicker" fill="#bd4949">NÃO IMPLEMENTADO</text><text x="2025" y="1401" class="card-title-small" fill="#192923">Database</text><text x="2025" y="1436" class="body" fill="#65766e">Nenhum banco de</text><text x="2025" y="1465" class="body" fill="#65766e">dados remoto/local.</text><path d="M385,1445 L400,1445" fill="none" stroke="#bd4949" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/><path d="M705,1445 L720,1445" fill="none" stroke="#bd4949" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/><path d="M1025,1445 L1040,1445" fill="none" stroke="#bd4949" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/><path d="M1345,1445 L1360,1445" fill="none" stroke="#bd4949" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/><path d="M1665,1445 L1680,1445" fill="none" stroke="#bd4949" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/><path d="M1985,1445 L2000,1445" fill="none" stroke="#bd4949" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/><text x="80" y="1630" class="foot">Conclusão: o RBAC e as políticas nesta entrega são controles de interface para demonstração, não uma fronteira de segurança de produção.</text></svg>