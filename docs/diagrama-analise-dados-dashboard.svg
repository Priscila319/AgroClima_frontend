<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="1740" viewBox="0 0 2480 1740">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#167c55"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10z" fill="#bd4949"/></marker>
  <style>
    text { font-family: 'DejaVu Sans', Arial, sans-serif; }
    .title { font-size: 43px; font-weight: 700; fill: #0b3024; letter-spacing: -1px; }
    .subtitle { font-size: 22px; fill: #65766e; }
    .subtitle-small { font-size: 16px; fill: #65766e; }
    .section { font-size: 15px; font-weight: 800; fill: #167c55; letter-spacing: 2px; }
    .kicker { font-size: 13px; font-weight: 800; letter-spacing: 1.4px; }
    .card-title { font-size: 21px; font-weight: 700; fill: #192923; }
    .card-title-small { font-size: 18px; font-weight: 700; fill: #192923; }
    .body { font-size: 16px; fill: #65766e; }
    .small { font-size: 14px; fill: #65766e; }
    .tiny { font-size: 12px; fill: #65766e; }
    .flow-label { font-size: 15px; font-weight: 700; fill: #167c55; }
    .warning-title { font-size: 20px; font-weight: 800; fill: #bd4949; }
    .warning-text { font-size: 15px; fill: #192923; }
    .foot { font-size: 14px; fill: #65766e; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#f5f8f6"/>
<rect x="36" y="35" width="2408" height="1670" rx="30" fill="none" stroke="#e0eae4" stroke-width="2"/>
<text x="78" y="105" class="title">Análise de dados e Dashboard</text>
<text x="80" y="151" class="subtitle">Fluxo real de cadastro, colheita, consulta e visualização no projeto atual — dados climáticos ainda são fixtures.</text>
<rect x="58" y="188" width="2364" height="990" rx="25" fill="#ffffff" stroke="#cfe1d6" stroke-width="2"/><text x="82" y="230" class="section">1 · CADASTRO E COLHEITA (GRAVAÇÃO)</text><text x="82" y="258" class="subtitle-small">Data de plantio automática no cadastro; a colheita só recebe data quando o produtor confirma.</text><rect x="75" y="290" width="395" height="250" rx="20" fill="#f1f7f3" stroke="#dce7e0" stroke-width="2"/><rect x="75" y="290" width="8" height="250" rx="4" fill="#167c55"/><text x="100" y="327" class="kicker" fill="#167c55">ENTRADA</text><text x="100" y="361" class="card-title" fill="#192923">Produtor</text><text x="100" y="403" class="body" fill="#65766e">Minhas Plantações</text><text x="100" y="432" class="body" fill="#65766e">views/pages/plantations.js</text><text x="100" y="461" class="body" fill="#65766e">Tipo de uva · quantidade</text><text x="100" y="490" class="body" fill="#65766e">talhão e observações.</text><rect x="490" y="290" width="360" height="250" rx="20" fill="#f3effa" stroke="#dce7e0" stroke-width="2"/><rect x="490" y="290" width="8" height="250" rx="4" fill="#7654b5"/><text x="515" y="327" class="kicker" fill="#7654b5">DATA-FORM / DATA-ACTION</text><text x="515" y="361" class="card-title" fill="#192923">Eventos da interface</text><text x="515" y="403" class="body" fill="#65766e">events/index.js</text><text x="515" y="432" class="body" fill="#65766e">create-plantation /</text><text x="515" y="461" class="body" fill="#65766e">harvest-plantation</text><text x="515" y="490" class="body" fill="#65766e">Validação do formulário.</text><rect x="870" y="290" width="440" height="250" rx="20" fill="#fff7e6" stroke="#dce7e0" stroke-width="2"/><rect x="870" y="290" width="8" height="250" rx="4" fill="#bd7d13"/><text x="895" y="327" class="kicker" fill="#bd7d13">SERVIÇO LOCAL</text><text x="895" y="361" class="card-title" fill="#192923">Regras de plantio</text><text x="895" y="403" class="body" fill="#65766e">modules/plantations.js</text><text x="895" y="432" class="body" fill="#65766e">Cadastro: plantedAt = agora;</text><text x="895" y="461" class="body" fill="#65766e">harvestedAt = null; status Em cultivo.</text><text x="895" y="490" class="body" fill="#65766e">Colheita: data agora + status Colhida.</text><rect x="1330" y="290" width="390" height="250" rx="20" fill="#edf4fb" stroke="#dce7e0" stroke-width="2"/><rect x="1330" y="290" width="8" height="250" rx="4" fill="#2879c9"/><text x="1355" y="327" class="kicker" fill="#2879c9">PERSISTÊNCIA</text><text x="1355" y="361" class="card-title" fill="#192923">Repositório JSON</text><text x="1355" y="403" class="body" fill="#65766e">data/local-repository.js</text><text x="1355" y="432" class="body" fill="#65766e">savePlantations()</text><text x="1355" y="461" class="body" fill="#65766e">Chave: agroclima:plantations</text><rect x="1740" y="290" width="650" height="250" rx="20" fill="#f1f7f3" stroke="#dce7e0" stroke-width="2"/><rect x="1740" y="290" width="8" height="250" rx="4" fill="#167c55"/><text x="1765" y="327" class="kicker" fill="#167c55">ARMAZENAMENTO LOCAL</text><text x="1765" y="361" class="card-title" fill="#192923">localStorage deste navegador</text><text x="1765" y="403" class="body" fill="#65766e">Histórico de plantios mantido localmente.</text><text x="1765" y="432" class="body" fill="#65766e">Não há API, ORM ou banco remoto.</text><text x="1765" y="461" class="body" fill="#65766e">Ação de cadastro/colheita também</text><text x="1765" y="490" class="body" fill="#65766e">gera um evento de auditoria.</text><path d="M470,415 L490,415" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><path d="M850,415 L870,415" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><path d="M1310,415 L1330,415" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><path d="M1720,415 L1740,415" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><text x="82" y="600" class="section">2 · CONSULTA E APRESENTAÇÃO (LEITURA)</text><text x="82" y="628" class="subtitle-small">Os dados são lidos do mesmo localStorage e encaminhados pelo store às páginas; séries climáticas/mercado são estáticas.</text><rect x="75" y="665" width="350" height="205" rx="20" fill="#f1f7f3" stroke="#dce7e0" stroke-width="2"/><rect x="75" y="665" width="8" height="205" rx="4" fill="#167c55"/><text x="100" y="702" class="kicker" fill="#167c55">FONTE LOCAL</text><text x="100" y="736" class="card-title" fill="#192923">localStorage</text><text x="100" y="778" class="body" fill="#65766e">agroclima:plantations</text><text x="100" y="807" class="body" fill="#65766e">agroclima:audit-events</text><rect x="445" y="665" width="350" height="205" rx="20" fill="#edf4fb" stroke="#dce7e0" stroke-width="2"/><rect x="445" y="665" width="8" height="205" rx="4" fill="#2879c9"/><text x="470" y="702" class="kicker" fill="#2879c9">LEITURA JSON</text><text x="470" y="736" class="card-title" fill="#192923">Repository + módulos</text><text x="470" y="778" class="body" fill="#65766e">loadPlantations()</text><text x="470" y="807" class="body" fill="#65766e">getPlantations() / getAuditEvents()</text><rect x="815" y="665" width="350" height="205" rx="20" fill="#f3effa" stroke="#dce7e0" stroke-width="2"/><rect x="815" y="665" width="8" height="205" rx="4" fill="#7654b5"/><text x="840" y="702" class="kicker" fill="#7654b5">STORE DA SPA</text><text x="840" y="736" class="card-title" fill="#192923">Estado e rotas</text><text x="840" y="778" class="body" fill="#65766e">state/store.js</text><text x="840" y="807" class="body" fill="#65766e">config/routes.js</text><text x="840" y="836" class="body" fill="#65766e">renderPage(state)</text><rect x="1185" y="665" width="360" height="205" rx="20" fill="#f1f7f3" stroke="#dce7e0" stroke-width="2"/><rect x="1185" y="665" width="8" height="205" rx="4" fill="#167c55"/><text x="1210" y="702" class="kicker" fill="#167c55">VIEWS</text><text x="1210" y="736" class="card-title" fill="#192923">Páginas do Produtor</text><text x="1210" y="778" class="body" fill="#65766e">Visão geral · plantações</text><text x="1210" y="807" class="body" fill="#65766e">histórico · relatório da produção</text><rect x="1565" y="665" width="380" height="205" rx="20" fill="#fff7e6" stroke="#dce7e0" stroke-width="2"/><rect x="1565" y="665" width="8" height="205" rx="4" fill="#bd7d13"/><text x="1590" y="702" class="kicker" fill="#bd7d13">VIEWS</text><text x="1590" y="736" class="card-title" fill="#192923">Páginas do Analista</text><text x="1590" y="778" class="body" fill="#65766e">Dashboard · Histórico</text><text x="1590" y="807" class="body" fill="#65766e">Relatórios com séries e consolidação</text><rect x="1965" y="665" width="420" height="205" rx="20" fill="#edf4fb" stroke="#dce7e0" stroke-width="2"/><rect x="1965" y="665" width="8" height="205" rx="4" fill="#2879c9"/><text x="1990" y="702" class="kicker" fill="#2879c9">APRESENTAÇÃO</text><text x="1990" y="736" class="card-title" fill="#192923">Componentes visuais</text><text x="1990" y="778" class="body" fill="#65766e">charts.js · tables.js</text><text x="1990" y="807" class="body" fill="#65766e">SVG / HTML · gráficos, tabelas</text><text x="1990" y="836" class="body" fill="#65766e">e indicadores</text><path d="M425,767 L445,767" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><path d="M795,767 L815,767" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><path d="M1165,767 L1185,767" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><path d="M1545,767 L1565,767" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><path d="M1945,767 L1965,767" fill="none" stroke="#167c55" stroke-width="4" marker-end="url(#arrow)"/><rect x="76" y="895" width="2328" height="250" rx="18" fill="#f8fbf9" stroke="#e2ebe5" stroke-width="2"/><text x="102" y="930" class="section">DADOS E EVENTOS UTILIZADOS PELAS TELAS</text><rect x="96" y="950" width="700" height="185" rx="20" fill="#ffffff" stroke="#dce7e0" stroke-width="2"/><rect x="96" y="950" width="8" height="185" rx="4" fill="#167c55"/><text x="121" y="987" class="kicker" fill="#167c55">ESTRUTURA JSON</text><text x="121" y="1021" class="card-title-small" fill="#192923">Registro Plantação</text><text x="121" y="1056" class="body" fill="#65766e">{ id, variety, quantity, field, notes,</text><text x="121" y="1085" class="body" fill="#65766e">  plantedAt, harvestedAt, status, createdBy }</text><rect x="835" y="950" width="700" height="185" rx="20" fill="#ffffff" stroke="#dce7e0" stroke-width="2"/><rect x="835" y="950" width="8" height="185" rx="4" fill="#2879c9"/><text x="860" y="987" class="kicker" fill="#2879c9">NÃO É INGESTÃO DE SENSORES</text><text x="860" y="1021" class="card-title-small" fill="#192923">Séries de referência</text><text x="860" y="1056" class="body" fill="#65766e">js/data/series.js + varieties.js</text><text x="860" y="1085" class="body" fill="#65766e">Temperatura, umidade, preços e scores são</text><text x="860" y="1114" class="body" fill="#65766e">dados demonstrativos já escritos no código.</text><rect x="1574" y="950" width="800" height="185" rx="20" fill="#ffffff" stroke="#dce7e0" stroke-width="2"/><rect x="1574" y="950" width="8" height="185" rx="4" fill="#7654b5"/><text x="1599" y="987" class="kicker" fill="#7654b5">AUDITORIA + ANÁLISE</text><text x="1599" y="1021" class="card-title-small" fill="#192923">Histórico e relatórios</text><text x="1599" y="1056" class="body" fill="#65766e">audit.js registra ações locais de plantio,</text><text x="1599" y="1085" class="body" fill="#65766e">colheita, análise e geração CSV; as páginas</text><text x="1599" y="1114" class="body" fill="#65766e">montam cronologia, resumo e exportação.</text><rect x="58" y="1205" width="2364" height="455" rx="25" fill="#fff9f8" stroke="#e4b7b3" stroke-width="2"/><text x="82" y="1250" class="warning-title">FLUXO DE BACKEND PEDIDO — NÃO EXISTE NESTE CHECKOUT</text><text x="82" y="1283" class="warning-text">O caminho real termina no armazenamento local do browser. Não há camada de integração entre localStorage e um servidor.</text><rect x="80" y="1330" width="380" height="230" rx="20" fill="#fff4f3" stroke="#bd4949" stroke-width="2" stroke-dasharray="11 9"/><text x="105" y="1367" class="kicker" fill="#bd4949">NÃO IMPLEMENTADO</text><text x="105" y="1401" class="card-title-small" fill="#192923">Database</text><text x="105" y="1436" class="body" fill="#65766e">Não há banco de</text><text x="105" y="1465" class="body" fill="#65766e">dados remoto/local.</text><rect x="480" y="1330" width="360" height="230" rx="20" fill="#fff4f3" stroke="#bd4949" stroke-width="2" stroke-dasharray="11 9"/><text x="505" y="1367" class="kicker" fill="#bd4949">NÃO IMPLEMENTADO</text><text x="505" y="1401" class="card-title-small" fill="#192923">ORM / Repository</text><text x="505" y="1436" class="body" fill="#65766e">Não há mapeamento;</text><text x="505" y="1465" class="body" fill="#65766e">o repo atual é localStorage.</text><rect x="860" y="1330" width="345" height="230" rx="20" fill="#fff4f3" stroke="#bd4949" stroke-width="2" stroke-dasharray="11 9"/><text x="885" y="1367" class="kicker" fill="#bd4949">NÃO IMPLEMENTADO</text><text x="885" y="1401" class="card-title-small" fill="#192923">Service backend</text><text x="885" y="1436" class="body" fill="#65766e">Regras de plantio</text><text x="885" y="1465" class="body" fill="#65766e">rodam no browser.</text><rect x="1225" y="1330" width="365" height="230" rx="20" fill="#fff4f3" stroke="#bd4949" stroke-width="2" stroke-dasharray="11 9"/><text x="1250" y="1367" class="kicker" fill="#bd4949">NÃO IMPLEMENTADO</text><text x="1250" y="1401" class="card-title-small" fill="#192923">DTOs</text><text x="1250" y="1436" class="body" fill="#65766e">Sem payloads ou</text><text x="1250" y="1465" class="body" fill="#65766e">contratos de API.</text><rect x="1610" y="1330" width="340" height="230" rx="20" fill="#fff4f3" stroke="#bd4949" stroke-width="2" stroke-dasharray="11 9"/><text x="1635" y="1367" class="kicker" fill="#bd4949">NÃO IMPLEMENTADO</text><text x="1635" y="1401" class="card-title-small" fill="#192923">API / Controller</text><text x="1635" y="1436" class="body" fill="#65766e">Não há endpoints</text><text x="1635" y="1465" class="body" fill="#65766e">para dashboards.</text><rect x="1970" y="1330" width="380" height="230" rx="20" fill="#fff4f3" stroke="#bd4949" stroke-width="2" stroke-dasharray="11 9"/><text x="1995" y="1367" class="kicker" fill="#bd4949">NÃO IMPLEMENTADO</text><text x="1995" y="1401" class="card-title-small" fill="#192923">Dashboard / Reports API</text><text x="1995" y="1436" class="body" fill="#65766e">Clima/mercado não</text><text x="1995" y="1465" class="body" fill="#65766e">são coletados ao vivo.</text><path d="M460,1445 L480,1445" fill="none" stroke="#bd4949" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/><path d="M840,1445 L860,1445" fill="none" stroke="#bd4949" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/><path d="M1205,1445 L1225,1445" fill="none" stroke="#bd4949" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/><path d="M1590,1445 L1610,1445" fill="none" stroke="#bd4949" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/><path d="M1950,1445 L1970,1445" fill="none" stroke="#bd4949" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/><text x="80" y="1630" class="foot">Fluxo implementado: Produtor → Plantação → JSON local → Histórico/Relatório → componentes de dashboard. Nada é sincronizado entre navegadores.</text></svg>